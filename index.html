<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />

    <!-- Viewport: prevents zoom, enables safe-area for notched phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- PWA / Theme -->
    <meta name="theme-color" content="#FFE600" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.json" />
    <!-- SEO -->
    <title>FF Arena — Free Fire Esports Tournament Platform India</title>
    <meta name="description" content="India's #1 Free Fire MAX tournament platform. Join 48-player Solo/Duo/Squad matches, win ₹10/kill, and withdraw instantly via UPI." />
    <meta name="keywords" content="free fire tournament, ff arena, esports india, free fire max, garena, battle royale tournament, cash tournament" />
    <!-- Open Graph -->
    <meta property="og:title" content="FF Arena — Compete. Rank. Win." />

    <!-- Google Fonts: Display + Body + Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

  </head>
  <body class="bg-[#050507] text-zinc-100 font-sans antialiased selection:bg-[#FFE600] selection:text-black min-h-[100dvh] overflow-x-hidden touch-manipulation">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
